<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Basic Calculator</title>
<link rel="stylesheet" href="calculator.css">
</head>

<body>

<div class="calculator">
    <div id="display" class="display">0</div>

    <div class="buttons">        
        <button class="clear" onclick="clearAll()">CA</button>
        <button class="clear" onclick="clearDisplay()">C</button>
        <button onclick="deleteLast()">⌫</button>
        <button class="operator" onclick="append('/')">/</button>
        <button class="operator" onclick="append('*')">*</button>

        <button onclick="append('7')">7</button>
        <button onclick="append('8')">8</button>
        <button onclick="append('9')">9</button>
        <button class="operator" onclick="append('-')">-</button>

        <button onclick="append('4')">4</button>
        <button onclick="append('5')">5</button>
        <button onclick="append('6')">6</button>
        <button class="operator" onclick="append('+')">+</button>

        <button type="button" onclick="append('1')">1</button>
        <button type="button" onclick="append('2')">2</button>
        <button type="button" onclick="append('3')">3</button>
        <button type="button" class="equal" onclick="calculateResult()">=</button>
        <button onclick="toggleHistory()">H</button>

        <button type="button" class="zero" onclick="append('0')">0</button>
        <button type="button" onclick="append('.')">.</button>
        <button onclick="appendBracket('(')">(</button>
        <button onclick="appendBracket(')')">)</button>
        <button onclick="toggleTheme()">🌓</button>
    </div>
</div>
<div id="historyPanel" class="history-panel"></div>
<script src="calculator.js"></script>

</body>
</html>
