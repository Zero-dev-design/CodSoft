{% extends "base.html" %}
{% block content %}

<h2>Users ({{ users|length }})</h2>

<table>
  <tr>
    <th>Username</th><th>Email</th><th>Role</th><th>Action</th>
  </tr>
  {% for user in users %}
  <tr>
    <td>{{ user.username }}</td>
    <td>{{ user.email }}</td>
    <td>{{ user.role }}</td>
    <td><a href="/admin/users/delete/{{ user.id }}">Delete</a></td>
  </tr>
  {% endfor %}
</table>

<h3>Add Role</h3>
<form method="POST" action="/admin/roles/add">
  <input name="role" placeholder="Role name">
  <button>Add</button>
</form>

{% endblock %}
